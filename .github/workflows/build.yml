name: Build God of Time (Forge 1.20.1)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find or extract source project
        shell: bash
        run: |
          set -euo pipefail
          project_dir=""

          if [[ -f build.gradle && -f src/main/java/com/godoftime/GodOfTimeMod.java ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            mkdir -p .ci-unpacked
            archive=""

            # Prefer the newest source archive.
            for candidate in ./godoftime-astral-orange-black.zip ./GodOfTimeMod-source.zip; do
              if [[ -f "$candidate" ]] && unzip -Z1 "$candidate" | grep -qE '(^|/)src/main/java/com/godoftime/GodOfTimeMod.java$'; then
                archive="$candidate"
                break
              fi
            done

            # Search other ZIP files if needed.
            if [[ -z "$archive" ]]; then
              while IFS= read -r -d '' candidate; do
                if unzip -Z1 "$candidate" | grep -qE '(^|/)src/main/java/com/godoftime/GodOfTimeMod.java$'; then
                  archive="$candidate"
                  break
                fi
              done < <(find . -maxdepth 1 -type f
